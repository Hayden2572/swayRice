# ==========================================================
# WEXP TMUX CONFIG
# ==========================================================

set -g mouse on
set -g history-limit 50000

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"

# Prefix: Ctrl + A instead of Ctrl + B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# No delay
set -sg escape-time 10

# Start windows/panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Split panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Status bar
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#cad3f5"

set -g status-left-length 50
set -g status-right-length 100

set -g status-left "#[fg=#8bd5ca,bold] #S "
set -g status-right "#[fg=#6e738d] %a %d #[fg=#8bd5ca]%H:%M "

setw -g window-status-format "#[fg=#6e738d] #I #W "
setw -g window-status-current-format "#[fg=#0b0f19,bg=#8bd5ca,bold] #I #W "

# Pane borders
set -g pane-border-style "fg=#1e2030"
set -g pane-active-border-style "fg=#8bd5ca"

# Messages
set -g message-style "bg=#8bd5ca,fg=#0b0f19"
set -g mode-style "bg=#8bd5ca,fg=#0b0f19"

# Clock
setw -g clock-mode-colour "#8bd5ca"
