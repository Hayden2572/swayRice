### =========================================================
### WEXP KITTY RICE
### =========================================================


### FONT

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.5

adjust_line_height 105%
adjust_column_width 100%

disable_ligatures never


### WAYLAND / WINDOW

linux_display_server wayland

hide_window_decorations yes
confirm_os_window_close 0

remember_window_size no
initial_window_width 1150
initial_window_height 720

window_padding_width 16
single_window_margin_width 0

enabled_layouts splits,tall,stack


### BACKGROUND

background #0b0f19
foreground #cad3f5

background_opacity 0.78
dynamic_background_opacity yes

dim_opacity 0.75


### CURSOR

cursor #8bd5ca
cursor_text_color #0b0f19
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5


### SELECTION

selection_foreground #0b0f19
selection_background #8bd5ca


### URLS

url_color #8bd5ca
url_style curly
open_url_with default


### TABS

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

tab_title_template " {index} {title} "
active_tab_title_template " {index} {title} "

active_tab_foreground   #0b0f19
active_tab_background   #8bd5ca
active_tab_font_style   bold

inactive_tab_foreground #7f849c
inactive_tab_background #181926
inactive_tab_font_style normal

tab_bar_background #0b0f19


### COLORS — Catppuccin Macchiato-like

color0  #494d64
color1  #ed8796
color2  #a6da95
color3  #eed49f
color4  #8aadf4
color5  #c6a0f6
color6  #8bd5ca
color7  #b8c0e0

color8  #5b6078
color9  #ed8796
color10 #a6da95
color11 #eed49f
color12 #8aadf4
color13 #c6a0f6
color14 #8bd5ca
color15 #cad3f5


### BELL

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no


### SCROLLBACK

scrollback_lines 10000
wheel_scroll_multiplier 3.0


### MOUSE

copy_on_select no
strip_trailing_spaces smart


### KEYBINDS — WINDOWS / SPLITS

map ctrl+shift+enter new_window
map ctrl+shift+w close_window

map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

map ctrl+shift+l next_layout

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+semicolon neighboring_window right

map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+minus launch --location=hsplit


### KEYBINDS — FONT SIZE

map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0


### KEYBINDS — CLIPBOARD

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
